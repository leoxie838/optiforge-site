<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc">
  <title id="title">Warehouse package demo</title>
  <desc id="desc">Monochrome demo image showing a humanoid robot with high-visibility branding.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a1a1a"/>
      <stop offset="100%" stop-color="#3a3a3a"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="700" fill="url(#bg)"/>
  <rect x="80" y="90" width="1040" height="520" fill="none" stroke="#bdbdbd" stroke-width="3"/>
  <g fill="#efefef">
    <rect x="530" y="170" width="140" height="170" rx="20"/>
    <rect x="485" y="355" width="230" height="170" rx="26"/>
    <rect x="450" y="370" width="30" height="120" rx="10"/>
    <rect x="720" y="370" width="30" height="120" rx="10"/>
    <rect x="520" y="535" width="55" height="70" rx="12"/>
    <rect x="625" y="535" width="55" height="70" rx="12"/>
  </g>
  <rect x="485" y="355" width="230" height="16" fill="#090909"/>
  <text x="600" y="650" text-anchor="middle" fill="#ffffff" font-family="Arial, sans-serif" font-size="34" font-weight="700">WAREHOUSE PACKAGE</text>
</svg>

